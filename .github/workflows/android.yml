name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (permissions, icon, edge-to-edge)
        run: node scripts/patch-android.js

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VecDraw.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VecDraw-apk
          path: VecDraw.apk

      - name: Publish release (tải APK trực tiếp trên điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VecDraw build ${{ github.run_number }}
          files: VecDraw.apk
